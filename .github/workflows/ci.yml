name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: mysql://root:@127.0.0.1:3306/talago_royal
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Kunci ke versi yang dipakai tim agar hasil CI sama dengan lokal.
          # Naikkan bersama-sama (lokal + CI) saat tim siap migrasi ke Flutter baru.
          flutter-version: 3.44.1
      - run: flutter pub get
      # Info/deprecation tidak menggagalkan build; error & warning tetap menggagalkan.
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --release
