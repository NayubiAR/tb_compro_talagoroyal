# Dependensi pengembangan untuk yang tidak memakai Laragon.
# Jalankan: docker compose up -d   → MySQL di localhost:3316 (root tanpa password), Redis di localhost:6379
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: talago_royal
    ports:
      - "3316:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
